<!Doctype html>
<html>
<head>
    <title>Food Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div style="max-width:500px; margin:auto; padding:20px; background:#1e293b; border-radius:10px;">

    <h2>Food Health Analyzer</h2>
    <form method="POST" action="/analyze">
        <label>Enter food name or barcode:</label>
        <br><br>
        <input
            type="text"
            name="food"
            placeholder="e.g. Nutella or 3017620422003"
            required
            style="padding:10px; border-radius:8px; border:none; width:80%;"
        >
        <br><br>
        <label>Select Condition</label>
        <br>
        <select name="condition">
            <option value="diabetic">Diabetic</option>
            <option value="high cholesterol">High Cholesterol</option>
            <option value="weight loss">Weight Loss</option>
        </select>
        <br><br>
        <button type="submit">Analyze</button>
    </form>
    </div>
</body>
</html>
